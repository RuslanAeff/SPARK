name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-07: iş akışı yalnız kodu okur; jeton varsayılan yazma yetkisi almaz.
permissions:
  contents: read

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest
    steps:
      # Action'lar etiket yerine commit SHA ile sabit (etiket sonradan taşınabilir).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Node 20 kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: TypeScript tip kontrolü
        run: npm run typecheck

      # UI denetimi CQ-01: yalnız hook kuralları (rules-of-hooks) birleştirmeyi
      # durdurur; diğer kurallar şimdilik uyarıdır (eslint.config.js).
      - name: Lint (hook kuralları)
        run: npm run lint

      - name: Birim testleri
        run: npm test -- --ci --coverage=false

      # SEC-07/SEC-08: üretim bağımlılıklarında bilinen zafiyetler raporlanır.
      # Kalan yüksek kayıtlar Expo SDK 55 zincirinde (erişilemezlik denetim
      # raporunda belgeli); adım SDK yükseltmesine kadar CI'ı kırmaz.
      - name: Bağımlılık zafiyet taraması (rapor)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
